<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Noor (NUR) mark">
  <title>Noor (NUR) — mark</title>
  <desc>Transparent-background mark for light surfaces and token lists.</desc>
  <defs>
    <linearGradient id="m-gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF4D0"/>
      <stop offset="0.42" stop-color="#FFCF6B"/>
      <stop offset="1" stop-color="#D98A15"/>
    </linearGradient>
    <linearGradient id="m-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B33"/>
      <stop offset="1" stop-color="#1A4E80"/>
    </linearGradient>
  </defs>
  <g fill="url(#m-gold)">
    <rect x="38" y="38" width="124" height="124" rx="7"/>
    <rect x="38" y="38" width="124" height="124" rx="7" transform="rotate(45 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="35" fill="url(#m-navy)"/>
  <circle cx="100" cy="100" r="22" fill="url(#m-gold)"/>
  <circle cx="100" cy="100" r="9" fill="#FFFBEE"/>
</svg>
